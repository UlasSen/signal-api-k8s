apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal-api
  template:
    metadata:
      labels:
        app: signal-api
    spec:
      containers:
      - name: signal-api-container
        image: signal-api
        imagePullPolicy: Never
        ports:
        - containerPort: 8000